---
# ═══════════════════════════════════════════════════════════════
# CloudField Ansible Playbook
# Executes: kubectl apply, MinIO lifecycle, ConfigMap update
# Usage: ansible-playbook -i inventory.ini playbook.yml
# ═══════════════════════════════════════════════════════════════
- name: CloudField – Deploy & Configure
  hosts: cloudfield
  gather_facts: false

  vars:
    project_dir: "/mnt/c/Users/billx/Desktop/CloudField"
    minio_url: "http://minio.172.31.76.79.nip.io"
    minio_user: "minioadmin"
    minio_pass: "minioadmin"

  tasks:

    # ── D.4: kubectl apply for all YAMLs ──────────────────────
    - name: "D.4 | Apply RabbitMQ"
      command: kubectl apply -f "{{ project_dir }}/rabbitmq.yaml"
      register: rabbitmq_result
      changed_when: "'configured' in rabbitmq_result.stdout or 'created' in rabbitmq_result.stdout"

    - name: "D.4 | Apply MinIO"
      command: kubectl apply -f "{{ project_dir }}/minio.yaml"
      register: minio_result
      changed_when: "'configured' in minio_result.stdout or 'created' in minio_result.stdout"

    - name: "D.4 | Apply ThingsBoard"
      command: kubectl apply -f "{{ project_dir }}/thingsboard.yaml"
      register: tb_result
      changed_when: "'configured' in tb_result.stdout or 'created' in tb_result.stdout"

    - name: "D.4 | Apply Keycloak"
      command: kubectl apply -f "{{ project_dir }}/keycloak.yaml"
      register: keycloak_result
      changed_when: "'configured' in keycloak_result.stdout or 'created' in keycloak_result.stdout"

    - name: "D.4 | Apply Node-RED"
      command: kubectl apply -f "{{ project_dir }}/nodered.yaml"
      register: nodered_result
      changed_when: "'configured' in nodered_result.stdout or 'created' in nodered_result.stdout"

    - name: "D.4 | Apply ArgoCD Ingress & Application"
      command: kubectl apply -f "{{ project_dir }}/argocd.yaml"
      register: argocd_result
      changed_when: "'configured' in argocd_result.stdout or 'created' in argocd_result.stdout"

    - name: "D.4 | Show apply results"
      debug:
        msg:
          - "RabbitMQ: {{ rabbitmq_result.stdout_lines }}"
          - "MinIO: {{ minio_result.stdout_lines }}"
          - "ThingsBoard: {{ tb_result.stdout_lines }}"
          - "Node-RED: {{ nodered_result.stdout_lines }}"

    # ── D.5: MinIO lifecycle policy via mc + port-forward ─────
    - name: "D.5 | Check if mc (MinIO Client) is installed"
      command: which mc
      register: mc_check
      ignore_errors: true
      changed_when: false

    - name: "D.5 | Install mc if not present"
      shell: |
        curl -fsSL https://dl.min.io/client/mc/release/linux-amd64/mc -o /usr/local/bin/mc
        chmod +x /usr/local/bin/mc
      when: mc_check.rc != 0
      become: true

    - name: "D.5 | Apply MinIO lifecycle via port-forward"
      shell: |
        # Start port-forward in background
        kubectl port-forward svc/minio 9000:9000 &
        PF_PID=$!
        sleep 3

        # Configure mc alias with localhost:9000
        mc alias set cloudfield http://localhost:9000 {{ minio_user }} {{ minio_pass }} --api S3v4

        # Create buckets if they don't exist
        mc mb --ignore-existing cloudfield/farm-data
        mc mb --ignore-existing cloudfield/farm-images

        # Apply lifecycle policies
        mc ilm rule add --expire-days 30 cloudfield/farm-data
        mc ilm rule add --expire-days 7 cloudfield/farm-images

        # Show the rules
        echo "=== farm-data lifecycle ==="
        mc ilm rule ls cloudfield/farm-data
        echo "=== farm-images lifecycle ==="
        mc ilm rule ls cloudfield/farm-images

        # Kill the port-forward
        kill $PF_PID 2>/dev/null || true
      register: lifecycle_result
      changed_when: true

    - name: "D.5 | Show lifecycle results"
      debug:
        msg: "{{ lifecycle_result.stdout_lines }}"

    # ── D.6: Update ConfigMap nodered-flow ────────────────────
    - name: "D.6 | Generate nodered-flow ConfigMap from flows.json"
      command: >
        kubectl create configmap nodered-flow
        --from-file=flows.json="{{ project_dir }}/flows.json"
        --dry-run=client
        -o yaml
      register: configmap_yaml
      changed_when: false

    - name: "D.6 | Apply updated nodered-flow ConfigMap"
      shell: |
        kubectl create configmap nodered-flow \
          --from-file=flows.json="{{ project_dir }}/flows.json" \
          --dry-run=client -o yaml | kubectl apply -f -
      register: configmap_result
      changed_when: "'configured' in configmap_result.stdout or 'created' in configmap_result.stdout"

    - name: "D.6 | Restart Node-RED to pick up new flows"
      command: kubectl rollout restart deployment nodered
      when: configmap_result.changed

    - name: "D.6 | Show ConfigMap result"
      debug:
        msg: "ConfigMap nodered-flow: {{ configmap_result.stdout }}"

    # ── Summary ────────────────────────────────────────────────
    - name: "CloudField deployment complete!"
      debug:
        msg:
          - "Node-RED:    http://nodered.172.31.76.79.nip.io"
          - "ThingsBoard: http://thingsboard.172.31.76.79.nip.io"
          - "MinIO:       http://minio.172.31.76.79.nip.io"
          - "ArgoCD:      http://argocd.172.31.76.79.nip.io"
          - "Jenkins:     http://jenkins.172.31.76.79.nip.io"
