# ═══════════════════════════════════════════════════════════════
# CloudField – Prometheus Alert Rules (F.6)
# Alert: RabbitMQ queue depth > 10 → CRITICAL
# ═══════════════════════════════════════════════════════════════
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cloudfield-alerts
  namespace: observability
  labels:
    release: kube-prom-stack
    app: cloudfield
spec:
  groups:
  - name: cloudfield.rabbitmq
    interval: 30s
    rules:

    # ── Alert: Queue Depth > 10 ────────────────────────────────
    - alert: RabbitMQQueueDepthHigh
      expr: rabbitmq_queue_messages{queue="valve.commands"} > 10
      for: 1m
      labels:
        severity: critical
        team: cloudfield
      annotations:
        summary: "RabbitMQ queue depth is high"
        description: >
          The 'valve.commands' queue has {{ $value }} messages (> 10).
          Possible congestion or inactive consumer.
        runbook_url: "http://grafana.172.31.76.79.nip.io"

    # ── Alert: Queue Depth Warning (> 5) ──────────────────────
    - alert: RabbitMQQueueDepthWarning
      expr: rabbitmq_queue_messages{queue="valve.commands"} > 5
      for: 2m
      labels:
        severity: warning
        team: cloudfield
      annotations:
        summary: "RabbitMQ queue depth is increasing"
        description: >
          The 'valve.commands' queue has {{ $value }} messages (> 5).
          Monitor the situation.

    # ── Alert: RabbitMQ Down ───────────────────────────────────
    - alert: RabbitMQDown
      expr: up{job="rabbitmq-prometheus"} == 0
      for: 1m
      labels:
        severity: critical
        team: cloudfield
      annotations:
        summary: "RabbitMQ is not accessible"
        description: "The RabbitMQ instance is not responding to Prometheus scrape."

  - name: cloudfield.telemetry
    interval: 60s
    rules:

    # ── Alert: Telemetry Rate = 0 (no messages) ───────────────
    - alert: TelemetryRateZero
      expr: rate(rabbitmq_queue_messages_published_total[5m]) == 0
      for: 5m
      labels:
        severity: warning
        team: cloudfield
      annotations:
        summary: "Zero telemetry rate"
        description: >
          No new messages in RabbitMQ for the last 5 minutes.
          Check the Node-RED pipeline.
