        {
            "id": "9a604413480ec6c4",
            "type": "function",
            "z": "2e9e09f5ef172d8d",
            "name": "function 4 – Idempotency Check",
            "func": "// ═══════════════════════════════════════════════════\n// Idempotency Pattern – Φάση H\n// Αποτρέπει διπλές εντολές στη valve.commands queue\n// Χρησιμοποιεί flow context για αποθήκευση τελευταίας εντολής\n// ═══════════════════════════════════════════════════\n\n// Πρώτα σιγουρευόμαστε ότι το msg.payload είναι object\nif (typeof msg.payload === 'string') {\n    try {\n        msg.payload = JSON.parse(msg.payload);\n    } catch (e) {\n        node.error(\"Το μήνυμα δεν είναι έγκυρο JSON\");\n        return null;\n    }\n}\n\nconst command = msg.payload;\n\n// Κανονικοποίησε: δημιούργησε unique key για την εντολή\nvar cmdKey = (command.action || command.command || 'unknown') + ':' + (command.valve || command.valve_id || '1');\n\n// Διάβασε την τελευταία εντολή από το flow context\nvar lastCmdKey = flow.get('lastValveCommand') || null;\nvar lastCmdTime = flow.get('lastValveCommandTime') || 0;\nvar now = Date.now();\n\n// Idempotency window: 5 δευτερόλεπτα\nvar IDEMPOTENCY_WINDOW_MS = 5000;\n\nif (lastCmdKey === cmdKey && (now - lastCmdTime) < IDEMPOTENCY_WINDOW_MS) {\n    // DUPLICATE εντολή – αγνόησε\n    node.warn('IDEMPOTENT SKIP: Duplicate command \"' + cmdKey + '\" within ' + IDEMPOTENCY_WINDOW_MS + 'ms window');\n    node.status({fill:'yellow', shape:'ring', text:'DUPLICATE: ' + cmdKey});\n    return null;  // Σταμάτα το flow\n}\n\n// Νέα εντολή – αποθήκευσε στο context\nflow.set('lastValveCommand', cmdKey);\nflow.set('lastValveCommandTime', now);\n\n// Ενημέρωσε status\nif (command.action === 'open' || command.command === 'OPEN') {\n    node.status({fill:'green', shape:'dot', text:'SENT: Valve OPEN'});\n} else if (command.action === 'close' || command.command === 'CLOSE') {\n    node.status({fill:'red', shape:'dot', text:'SENT: Valve CLOSED'});\n} else {\n    node.status({fill:'blue', shape:'dot', text:'SENT: ' + cmdKey});\n}\n\nnode.log('IDEMPOTENT PASS: New command \"' + cmdKey + '\" – forwarding');\nreturn msg;",
