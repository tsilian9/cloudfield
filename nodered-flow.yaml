            "name": "function 3",
            "func": "// Χρησιμοποίησε global context για να θυμάται την προηγούμενη τιμή\nlet tankLevel = context.get('tankLevel') || 100;\n\n// Η στάθμη μειώνεται κατά 1-5% κάθε φορά (προσομοίωση κατανάλωσης)\nconst decrease = Math.round(Math.random() * 5) + 1;\ntankLevel = Math.max(0, tankLevel - decrease);\n\n// Αν η στάθμη πέσει κάτω από 10%, γέμισε τη δεξαμενή\nif (tankLevel < 10) {\n    tankLevel = 100;\n    node.warn(\"🔄 Η δεξαμενή γέμισε ξανά!\");\n}\n\n// Αποθήκευση της νέας τιμής\ncontext.set('tankLevel', tankLevel);\n\n// Δημιουργία μηνύματος\nmsg.payload = {\n    tank_level: Math.round(tankLevel),\n    timestamp: Date.now()\n};\n\nnode.warn(`💧 Στάθμη δεξαμενής: ${Math.round(tankLevel)}%`);\n\nreturn msg;",
