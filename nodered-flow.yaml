            "func": "// Τυχαία τιμή υγρασίας (20-80%)\nconst moisture = Math.round(Math.random() * 60 + 20);\n\n// Τυχαία τιμή βροχής (true/false) - 30% πιθανότητα βροχής\nconst rain = Math.random() < 0.3;\n\n// Δημιουργία του μηνύματος για το ThingsBoard\nmsg.payload = {\n    soil_moisture: moisture,\n    rain_forecast: rain,\n    latitude: 37.9838,\n    longitude: 23.7275,\n    timestamp: Date.now()\n};\n\n// Εμφάνιση στο debug\nnode.warn(\"🌱 Υγρασία: \" + moisture + \"% | Βροχή: \" + (rain ? \"☔ ΝΑΙ\" : \"☀️ ΟΧΙ\"));\n\nreturn msg;",
