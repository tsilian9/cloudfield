        {
            "id": "tb-rpc-parse-001",
            "type": "function",
            "z": "2e9e09f5ef172d8d",
            "name": "Parse RPC → Valve Command",
            "func": "// Το ThingsBoard στέλνει: {\"method\": \"openValve\", \"params\": {\"valve\": 1}}\nconst rpc = msg.payload;\n\nif (!rpc || !rpc.method) {\n    node.warn(\"⚠️ Άγνωστο RPC μήνυμα: \" + JSON.stringify(rpc));\n    return null;\n}\n\nif (rpc.method === \"openValve\") {\n    msg.payload = { action: \"open\", valve: (rpc.params && rpc.params.valve) || 1 };\n    node.status({fill:\"green\", shape:\"dot\", text:\"RPC: openValve \" + msg.payload.valve});\n} else if (rpc.method === \"closeValve\") {\n    msg.payload = { action: \"close\", valve: (rpc.params && rpc.params.valve) || 1 };\n    node.status({fill:\"red\", shape:\"dot\", text:\"RPC: closeValve \" + msg.payload.valve});\n} else {\n    node.warn(\"⚠️ Άγνωστη μέθοδος RPC: \" + rpc.method);\n    return null;\n}\n\nnode.warn(\"🚿 Εντολή βάνας: \" + JSON.stringify(msg.payload));\nreturn msg;",
