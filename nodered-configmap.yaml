    \   // Εξαγωγή δεδομένων\\n    const temperature = weather.temperature;\\n    const
    windspeed = weather.windspeed;\\n    const weathercode = weather.weathercode;\\n\\n
    \   // Έλεγχος αν έχει βροχή (weathercode 51-67 = βροχή)\\n    const rain = (weathercode
    >= 51 && weathercode <= 67) || weathercode === 80 || weathercode === 81 || weathercode
    === 82;\\n\\n    // Δημιουργία μηνύματος\\n    msg.payload = {\\n        temperature:
    temperature,\\n        windspeed: windspeed,\\n        rain_forecast: rain,\\n
    \       weathercode: weathercode,\\n        timestamp: Date.now()\\n    };\\n\\n
    \   node.warn(`\U0001F324️ Θερμοκρασία: ${temperature}°C | Άνεμος: ${windspeed}
    km/h | Βροχή: ${rain ? '☔ ΝΑΙ' : '☀️ ΟΧΙ'}`);\\n} else {\\n    // Αν απέτυχε το
    HTTP Request, χρησιμοποίησε mock δεδομένα\\n    const mockTemp = Math.round(Math.random()
    * 20 + 15);\\n    const mockRain = Math.random() < 0.3;\\n    const mockWindspeed
    = Math.round(Math.random() * 20 + 5);\\n    const mockWeathercode = mockRain ?
    61 : 0;   // ← ΝΕΟ!\\n\\n    node.warn(`⚠️ Mock καιρός: ${mockTemp}°C | Άνεμος:
    ${mockWindspeed} km/h | Βροχή: ${mockRain ? '☔ ΝΑΙ' : '☀️ ΟΧΙ'}`);\\n\\n    msg.payload
